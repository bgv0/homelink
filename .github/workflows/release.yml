name: Release

# Push a tag like v0.1.0 to build installers into a draft GitHub release.
# Builds are unsigned for now (see docs/PLAN.md Phase 5).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ""
            bundles: target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        working-directory: apps/desktop/src-tauri
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then tag="dev-${GITHUB_SHA::7}"; fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "homelink $tag" --notes "Unsigned preview build."
          gh release upload "$tag" ${{ matrix.bundles }} --clobber
